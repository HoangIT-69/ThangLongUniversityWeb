# ===============================
# C?U H�NH SERVER
# ===============================
spring.config.import=optional:file:.env[.properties]
server.port=8080
spring.application.name=ThangLongUniversityWeb
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://localhost:3000,http://localhost:8080}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===============================
# 1. CẤU HÌNH DATABASE (POSTGRESQL)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/uni_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password123}
spring.datasource.driver-class-name=org.postgresql.Driver

# C?u h�nh JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# 2. C?U H�NH REDIS 
# ===============================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Th?i gian s?ng c?a Refresh Token trong Redis (t�nh b?ng Ng�y)
application.redis.refresh-token.ttl-days=7
application.redis.fallback-in-memory-enabled=${APP_REDIS_FALLBACK_IN_MEMORY_ENABLED:true}

# ===============================
# 3. C?U H?NH KAFKA (DISABLED FOR LOCAL DEVELOPMENT - NO BROKER AVAILABLE)
# ===============================
spring.kafka.enabled=false
# spring.kafka.bootstrap-servers=localhost:9092

